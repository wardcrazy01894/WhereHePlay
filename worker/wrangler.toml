# WhereHePlay API worker (leaderboard + accounts). Deploy by hand from the
# repo root — it does NOT deploy with the site (docs/OPERATIONS.md):
#   npm run worker:migrate && npm run worker:deploy

name = "whp-api"
main = "api.mjs"
compatibility_date = "2025-11-01"

[vars]
# Repo that in-app bug reports are filed in.
GH_REPO = "wardcrazy01894/WhereHePlay"
# Comma-separated allowed browser origins (the worker rejects others).
# localhost entries are for `npm run dev` against `npm run worker:dev`;
# capacitor://localhost + https://localhost are the native app shells
# (docs/APP.md).
ALLOWED_ORIGIN = "https://wardcrazy01894.github.io,http://localhost:5173,http://localhost:4173,capacitor://localhost,https://localhost"

# --- D1 database -------------------------------------------------------------
# Created 2026-11-11 with `npx wrangler d1 create whp-api` (the id is not a secret).
[[d1_databases]]
binding = "DB"
database_name = "whp-api"
database_id = "6f9ea7fd-db18-4731-a1e0-b6c9e5b5164a"
migrations_dir = "migrations"

# Per-IP rate limit on every request (GA binding; needs no account resource).
# 60 / 60s: a daily in three modes plus board views is a handful of calls.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Per IP + username on /login: 5 tries a minute.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "4002"

  [ratelimits.simple]
  limit = 5
  period = 60

# Per IP on /bug: 5 reports a minute (each one becomes a public GitHub issue).
[[ratelimits]]
name = "BUG_LIMITER"
namespace_id = "4003"

  [ratelimits.simple]
  limit = 5
  period = 60

# --- Secret (set once: `npx wrangler secret put GH_TOKEN -c worker/wrangler.toml`)
# GH_TOKEN  fine-grained GitHub PAT, "Issues: read and write" on this repo
#           only. Unset → /bug answers 503 and the site falls back to a
#           prefilled GitHub issue link.

# No [triggers]: the account's Workers Free cron slots are all in use, so the
# retention prune runs lazily from /score (pruneIfDue).
